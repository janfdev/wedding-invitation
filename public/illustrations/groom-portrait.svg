<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%" fill="none">
  <!-- Warm Studio Light Background Accent -->
  <defs>
    <radialGradient id="groomGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E232A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bespokeSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#272C35"/>
      <stop offset="100%" stop-color="#14171C"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#EADBC8"/>
    </linearGradient>
  </defs>

  <rect width="400" height="480" rx="28" fill="#181B20"/>
  <rect width="400" height="480" rx="28" fill="url(#groomGlow)"/>

  <!-- Architectural Background Frame Lines -->
  <rect x="24" y="24" width="352" height="432" rx="20" stroke="#C5A880" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="200" cy="180" r="110" stroke="#C5A880" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Groom Silhouette & Tailored Tuxedo -->
